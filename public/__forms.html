<!-- Netlify Forms registration only. Netlify reads this at deploy time to learn the
     form's fields; the real forms are components/AgentSignupForm.tsx (free-inbox-agent) and
     components/AiRecommendChecker.tsx (ai-recommend-lead), which POST here. -->
<!DOCTYPE html>
<html><body>
  <form name="free-inbox-agent" data-netlify="true" netlify-honeypot="company" hidden>
    <input type="hidden" name="form-name" value="free-inbox-agent" />
    <input name="name" />
    <input name="email" type="email" />
    <input name="phone" type="tel" />
    <input name="company" />
  </form>
  <form name="ai-recommend-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="ai-recommend-lead" />
    <input name="name" />
    <input name="email" type="email" />
    <input name="phone" type="tel" />
    <input name="practice" />
    <input name="score" />
    <input name="city" />
    <input name="bot-field" />
  </form>
</body></html>
